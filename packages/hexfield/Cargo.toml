[package]
name = "hexfield"
version.workspace = true
edition.workspace = true

# Own cdylib (`hexfield._rust`) — deliberately NOT a #[path] submodule of
# hexo_models._rust, whose single-crate design makes every rebuild change
# search semantics for all lineages at once. Building hexfield can never touch
# the live run's .so (spec §5.1 packaging discipline).

[lib]
name = "hexfield"
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
hexo_engine.workspace = true
hexo_utils.workspace = true
half = "2"
pyo3 = { workspace = true, optional = true }
rand.workspace = true
