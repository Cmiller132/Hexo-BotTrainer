[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexgnn"
version = "0.1.0"
description = "hexgnn — a stripped-down hexgt: GNN trunk + policy/value/opp heads, no context transformer, no STV. Reuses hexo_models._rust.hexgt natively."
requires-python = ">=3.11"
# STALE-CLAIM FIX (2026-06-12): the original "PURE-PYTHON, reuses _rust.hexgt"
# story (still echoed in `description` above — a metadata string, left untouched)
# no longer holds. hexgnn DOES carry its own Rust (rust/src), a fork of hexgt's
# crate that is `#[path]`-included into packages/hexo_models/rust/src/lib.rs and
# compiled into the hexo_models cdylib as the `hexo_models._rust.hexgnn`
# submodule. What remains true: installing/uninstalling THIS package never
# rebuilds the native module — only a maturin rebuild of hexo_models
# (scripts/_rebuild_hexo_models_hexgt.sh) picks up rust/src changes.
# STATUS: parked/legacy lineage (HANDOFF.md: "explored and set aside").
dependencies = [
  "torch>=2.2",
  "numpy",
  "hexo-engine==0.1.0",
  "hexo-runner==0.1.0",
  "hexo-train==0.1.0",
  "hexo-models==0.1.0",
]

# Registers the plugin under the same entry-point group hexo_train discovers, so
# the config-driven CLI (`python -m hexo_train.cli.train_model configs/hexgnn_model.toml`)
# can resolve `name = "hexgnn"`. The driver scripts/_rl_train_hexgnn.py does NOT
# need this (it builds the model directly), so PYTHONPATH-only use works without
# installing.
[project.entry-points."hexo_train.models"]
hexgnn = "hexgnn.plugin:get_plugin"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["hexgnn*"]
