# hexfield_main_2 RESUMED under the KataGo / dense_cnn_restnet replay buffer.
# Identical to hexfield_main_2.toml EXCEPT the [model.config.training] block, which
# swaps the v1 hard 32k window for the full dense mechanism (power-law taper window
# + recent-window cut + keep_prob + train-bucket governor + persisted train_state +
# packed columnar window + multithreaded Rust expand). Continuation is additive: the
# on-disk shard schema is unchanged, so the existing samples/epoch_*/game_*.npz are
# indexed in place (a manifest is built additively) and the latest checkpoint resumes
# with a FRESH governor (old checkpoints carry no train_state). See
# scripts/_hexfield_buffer_convert.py for the documented continuation path.
#
# Owner knobs (2026-06-17): shuffle_keep_target_rows = 600000 (long-term cap) and
# train_samples_per_epoch = 50000. 50k is kept <= rows/epoch(~7k) *
# max_train_bucket_per_new_data(8) = ~56k, so the reuse governor sustains ~7x reuse
# without throttling. main_2 has only ~230k rows ever produced, so the power-law
# taper window starts ~68k (taper of the current total) and grows sublinearly toward
# the 600k cap as self-play accumulates (keep_prob stays 1.0 until the window exceeds
# 600k). Radius-4 is preserved (HEXFIELD_SUPPORT_RADIUS=4 from the systemd unit).

[model]
name = "hexfield"
module = "hexfield.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 512
pcr_full_proportion = 0.33
pcr_fast_visits = 128
active_games = 128
c_puct = 1.5
virtual_batch_size = 4
flush_target = 1024
active_root_limit = 192
root_dirichlet_total_alpha = 10.83
root_dirichlet_noise_fraction = 0.25
fpu_reduction = 0.2
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
forced_playout_k = 2.0
policy_init_fraction = 0.25
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
temperature = 1.0
temperature_floor = 0.1
temperature_halflife_plies = 30.0
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144

# --- KataGo replay-buffer port (PLAN §6/§7) — the only change vs hexfield_main_2.toml ---
[model.config.training]
batch_rows = 32
learning_rate = 1e-3
weight_decay = 1e-4
grad_clip = 1.0
warmup_steps = 0
shuffle_min_rows = 20000
shuffle_keep_target_rows = 600000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.4
shuffle_taper_window_scale = 20000.0
validation_fraction = 0.0
train_samples_per_epoch = 50000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000.0
no_repeat_files = false
expand_backend = "rust"
expand_workers = 0

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5

[model.config.multi_stage_eval]
enabled = true
games_budget = 64
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 32
sealbot_share = 0.5
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
enabled = false

[model.config.multi_stage_eval.opponents]
sealbot_enabled = true
bracket_size = 1

[run]
name = "hexfield_main_2"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_2"
seed = 1

[loop]
epochs = 200

[selfplay]
games_per_epoch = 256
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
initialize_from = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_1/checkpoints/epoch_000034.pt"
save_name = "latest"
