# hexfield_eq_main_3 -- additive reach-conditioned alpha (ray7lut2) run.
# Search and training settings are copied unchanged from main_2. Architecture
# defaults come from scripts/prefit_env/hexfield_eq_raytap_a5_lut2.env:
# A5 feature-v2, RAYTAP=both, CCACCACA, plus RAYTAP_LUT=additive.
# The checkpoint meta is the authoritative architecture description and must
# match the launch environment exactly.

[model]
name = "hexfield_eq"
module = "hexfield_eq.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 256
# 100% PCR: every turn is a full move with a written Gumbel-target row.
pcr_full_proportion = 1.0
pcr_fast_visits = 192
pcr_fast_temperature = 0.0
active_games = 256
virtual_batch_size = 96
flush_target = 1024
active_root_limit = 256
max_game_plies = 256
tss_enabled = true
# TSS Stage-4 SHADOW (rung 2, docs/TSS_RUNBOOK.md, enabled at ep25 2026-07-13):
# deep solves + certificate verification at gated leaves, consuming NOTHING —
# play/targets bit-identical to off; collects the deep_* cost/UNKNOWN
# histograms in the epoch JSON tss block that size the consumption rungs.
# Rung ladder (docs/TSS_RUNBOOK.md; owner-ordered auto-deploy 2026-07-13).
# ep26: interior forced-move guard ON (Lever 0 — fully-forced nodes narrow to
# the hitting universe) + shadow at FULL sampling/cap 2000 on the OPTIMIZED
# solver (O12-O18: all buckets ≥20k nodes/s; the ep25 drag is gone).
# Next rungs, one epoch apart, gated on deep_verify_failed==0 + throughput:
# mode=2 (verified hard LOSS consumption), then mode=3 + tss_solver_root_guard.
tss_interior_guard = true
tss_solver_mode = 1
tss_solver_sample_16 = 16
tss_solver_node_cap = 2000
cache_max_states = 262144
nucleus_f64 = true
lcb_z = 1.6
clean_root_prior_cache = true

# Constant c_puct, with de-contaminated target search.
c_puct = 1.5
visit_scaled_c_puct = true
c_scale = 0.0
c_base = 500.0
root_dirichlet_noise_fraction = 0.0
root_dirichlet_total_alpha = 10.83
dirichlet_shaped = true
fpu_reduction = 0.2
root_fpu_reduction = 0.0
forced_playout_k = 0.0
pruned_dynamic_cpuct = true
lazy_widening = true
new_child_fpu = true
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
temperature = 1.0
temperature_floor = 0.15
temperature_halflife_plies = 20.0
root_policy_temperature = 1.05
policy_init_fraction = 0.35
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
ml_two_sided = false
ml_final_pick_band = 0.08
export_root_prior_logits = true

# Gumbel AlphaZero target regime; m=16 fits 256 visits exactly.
gumbel_root_enabled = true
gumbel_sequential_halving = true
gumbel_nonroot_select = true
gumbel_target_enabled = true
gumbel_c_visit = 50.0
gumbel_c_scale = 1.0
gumbel_m = 16
gumbel_target_min_visits = 1
gumbel_play_prune = true

[model.config.training]
batch_rows = 256
learning_rate = 5e-4
weight_decay = 1e-4
grad_clip = 5.0
adaptive_clip = true
clip_c = 1.75
clip_ema_decay = 0.99
clip_warmup_steps = 50
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.1
moves_left_weight = 0.2
q_head_weight = 0.1
soft_policy_weight = 0.5
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0
warmup_steps = 0
lr_schedule = "cosine"
lr_warmup_steps = 400
lr_final = 1e-4
lr_decay_epochs = 60
shuffle_min_rows = 7000
shuffle_keep_target_rows = 210000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.8
shuffle_taper_window_scale = 7000.0
validation_fraction = 0.0
train_samples_per_epoch = 56000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000.0
no_repeat_files = false
expand_backend = "rust"
expand_workers = 0
policy_target = "gumbel"

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5

[model.config.multi_stage_eval]
enabled = true
games_budget = 192
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 32
sealbot_share = 0.1667
strix_share = 0.3333
strix_weight = 1.0
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
enabled = false

[model.config.multi_stage_eval.opponents]
sealbot_enabled = true
strix_enabled = true
strix_ckpt = "/mnt/e/Hexo-BotTrainer/anchors/strix/checkpoint_00237000.pt"
strix_sims = 512
strix_m = 16
strix_device = "cuda"
strix_label = "strix"
bracket_size = 2
# No cross-feature-width permanent anchors.
permanent_anchors = []
radius8_opponents = []

[run]
name = "hexfield_eq_main_3"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/hexfield_eq_main_3"
seed = 1

[loop]
epochs = 200

[selfplay]
games_per_epoch = 256
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# Raw warm-start weights from the additive main_3 BC prefit.
initialize_from = "/mnt/e/Hexo-BotTrainer/runs/hexfield_eq_main3_prefit/additive/soak_init.pt"
save_name = "latest"
