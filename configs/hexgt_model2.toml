# Model 2 (hexgt) config — dynamic GNN + transformer hybrid.
#
# SCAFFOLD config. Model 2 is built CPU-only through Phase 4; the GPU phases
# (self-play / cold-start RL / eval) are deferred until the dense_cnn 96x8 run
# frees the GPU. The architecture is a truly dynamic typed heterogeneous GNN ->
# context transformer -> per-candidate dynamic policy + 65-bin value head. There
# is no board size / 1681 crop: inputs are variable-size packed graphs.
#
# Hyperparameters (token_dim / layers) are provisional, sized in Phase 3 to the
# ~2.1M-param budget of the running 96x8 baseline.

[model]
name = "hexgt"
module = "hexo_models.hexgt.plugin"

[model.config]
device = "cuda"

[model.config.architecture]
# Dynamic graph model shape (sized to ~2.1M params in Phase 3).
node_feature_dim = 32
token_dim = 168
gnn_layers = 3
ctx_layers = 3
attention_heads = 4
ffn_dim = 336
dropout = 0.0
short_term_value_horizons = [1, 4, 8]
# The single candidate-set neighborhood radius n (active windows UNION n-radius),
# tunable [2, 8]. Threaded into BOTH sample-gen and live MCTS. Phase-1 validation
# showed n=2 covers only ~85-92% of dense_cnn's strong moves (misses are far
# spread plays); n=8 = full legal set = 100% coverage. MVP uses 8 to avoid a
# move-vocabulary handicap; sweep down in Phase 5 for throughput.
candidate_radius = 8

[model.config.training]
batch_size = 128
# Lower LR + warmup than a CNN (transformer/GNN discipline).
learning_rate = 0.0003
weight_decay = 0.0001
warmup_steps = 1000
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.25
amp = true
max_grad_norm = 1.0
train_samples_per_epoch = 100000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000
no_repeat_files = true
max_validation_samples = 100000

[model.config.samples]
shuffle_min_rows = 100000
shuffle_keep_target_rows = 300000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.4
shuffle_taper_window_scale = 50000.0
approx_rows_per_out_file = 8000
shuffle_worker_group_size = 8000
validation_fraction = 0.0
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0

[model.config.selfplay]
search_visits = 512
active_games = 256
c_puct = 1.5
root_dirichlet_noise_enabled = true
root_dirichlet_noise_fraction = 0.25
root_dirichlet_total_alpha = 10.83
root_policy_temperature = 1.1
fpu_reduction = 0.20
virtual_loss = 1.0
# MCTS nucleus (top-p) widening within the model's full candidate support.
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
mcts_session_cache_max_states = 131072
mcts_active_root_limit = 256
max_actions = 1024
temperature = 1.0
temperature_schedule = [[0, 1.0], [30, 0.5], [90, 0.3]]
temperature_floor = 0.1
forced_playout_k = 2.0

[model.config.evaluation]
games_per_epoch = 64
sealbot_variant = "best"
sealbot_time_limit = 0.05
max_actions = 1024
require_sealbot = false
opening_temperature = 0.6
opening_moves = 8

[model.config.performance]
calibrate = true
target_selfplay_positions_per_second = 64.0
inference_batch_candidates = [128, 256, 512, 1024]
selfplay_batch_candidates = [256]
training_batch_candidates = [64, 128, 192, 256]
mcts_virtual_batch_candidates = [4]
selfplay_probe_positions = 2048
probe_batches = 1

[run]
name = "hexgt_model2"
output_dir = "../runs/hexgt_model2"
seed = 1

[loop]
epochs = 60

[selfplay]
games_per_epoch = 512
update_checkpoint_pointer = true
checkpoint_pointer = "../data/checkpoints/hexgt_model2_latest.txt"

[train]
passes_per_epoch = 1

[checkpoint]
save_name = "latest"
