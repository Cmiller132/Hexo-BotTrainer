# Model 1 TARGET config — 96ch x 8block deeper-trunk variant of target_96x6.
#
# This is a FRESH run, NOT a resume of any prior run: the trunk shape (96ch x
# 8block) changes the checkpoint shape, so 96x6 / 64x4 / scratch checkpoints will
# NOT load. Output goes to a new run dir.
#
# Same coupled design as 96x6 (shipped together), only the trunk depth differs:
#   - P7 fully-conv policy head  (automatic: architecture.py PolicyHead is now conv)
#   - channels 96
#   - residual_blocks 8   (deeper than 96x6's 6)
#   - search_visits 512
# Initialized from a SealBot-imitation prefit for THIS architecture (96x8 + P7),
# generated by scripts/_bootstrap_96x8.sh (5000 samples @ 100ms SealBot).

[model]
name = "dense_cnn"
module = "hexo_models.dense_cnn.plugin"

[model.config]
device = "cuda"

[model.config.architecture]
input_channels = 13
channels = 96
residual_blocks = 8
dropout = 0.0
short_term_value_horizons = [1, 4, 8]

[model.config.training]
batch_size = 256
learning_rate = 0.001
weight_decay = 0.0001
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.25
amp = true
max_grad_norm = 1.0
train_samples_per_epoch = 100000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000
no_repeat_files = true
max_validation_samples = 100000

[model.config.samples]
shuffle_min_rows = 100000
# Kept at the RAM-safe 300000 (see scratch_64 notes: 600000 crash-looped the
# shuffle on the 12 GB host budget). P8 freed eval-cache host RAM; re-widening is a
# separate decision to validate against the watchdog, not bundled here.
shuffle_keep_target_rows = 300000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.4
shuffle_taper_window_scale = 50000.0
approx_rows_per_out_file = 8000
shuffle_worker_group_size = 8000
validation_fraction = 0.0
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0

[model.config.selfplay]
# The co-primary fix: 512 search visits (4x) to generate sharp, well-explored
# policy targets that the P7 head + bigger trunk can actually learn from.
search_visits = 512
active_games = 256
c_puct = 1.5
root_dirichlet_noise_enabled = true
root_dirichlet_noise_fraction = 0.25
root_dirichlet_total_alpha = 10.83
root_policy_temperature = 1.1
fpu_reduction = 0.20
virtual_loss = 1.0
widening_policy_mass = 0.95
# Raised 32 -> 96: let the nucleus search consider more candidate moves per node
# (bounded by widening_policy_mass=0.95 cumulative prior). Broader search; the
# played-move temperature schedule below keeps mid/late moves decisive.
widening_max_children = 96
widening_min_children = 2
# Host-RAM headroom (P8): the eval cache is CPU priors, throughput-neutral here.
mcts_session_cache_max_states = 131072
mcts_active_root_limit = 256
max_actions = 1024
temperature = 1.0
# Move-selection temperature SCHEDULE (anchor points, ply -> temperature). Hot
# opening (1.0) for exploration, decayed to 0.5 by ply 30 and 0.3 by ply 90, then
# the final segment's slope continues down to temperature_floor (0.1, reached
# ~ply 150) and holds. Sharpens mid/late play so endgames are decided rather than
# sampled, while keeping opening diversity (Dirichlet + forced playouts).
temperature_schedule = [[0, 1.0], [30, 0.5], [90, 0.3]]
temperature_floor = 0.1
# KataGo forced playouts (k=2): guarantee each materialized root child
# ~sqrt(k * prior * root_visits) visits so Dirichlet root noise survives PUCT into
# the visit counts. Fixes the measured opening collapse (post-MCTS visits ~1.75 eff
# moves vs prior ~8). The exported policy target prunes the forced visits back out
# (policy-target pruning) so the network is not taught the forced exploration; the
# PLAYED move still samples the un-pruned visits, so self-play openings diversify.
forced_playout_k = 2.0

[model.config.evaluation]
games_per_epoch = 64
sealbot_variant = "best"
sealbot_time_limit = 0.05
max_actions = 1024
require_sealbot = true
opening_temperature = 0.6
opening_moves = 8

[model.config.performance]
calibrate = true
target_selfplay_positions_per_second = 64.0
inference_batch_candidates = [128, 256, 512, 1024]
selfplay_batch_candidates = [256]
# The calibration OOM guard drops any candidate that OOMs and selects the largest
# viable batch automatically. The deeper 8-block trunk costs more VRAM per sample
# than 96x6, so the guard may trim the top candidates here.
training_batch_candidates = [64, 128, 192, 256]
mcts_virtual_batch_candidates = [4]
selfplay_probe_positions = 2048
probe_batches = 1
# Inference-forward optimizations (see analysis/throughput_understanding.md).
#  - inference_use_tensorrt: route the MCTS eval forward through a TensorRT FP16
#    engine (built per-epoch from the checkpoint), correctness-gated vs torch FP16
#    with automatic torch fallback. Only ENGAGES where `tensorrt` imports (the WSL2
#    venv); on native Windows it cleanly FALLS BACK to torch FP16.
#  - inference_bucket_pad_multiple: round the padded forward batch up to this
#    multiple instead of a power of two (less padding waste). 0 = power-of-two.
inference_use_tensorrt = true
inference_bucket_pad_multiple = 16

[run]
name = "dense_cnn_model1_target_96x8"
output_dir = "../runs/dense_cnn_model1_target_96x8"
seed = 1

[loop]
epochs = 60

[selfplay]
# ROLLING REPLENISHMENT: games_per_epoch > active_games (256) keeps the active pool
# full as games finish. 512 = a 2x-longer epoch (2x samples) with the pool full for
# the first ~256 games, then the final 256-game drain.
games_per_epoch = 512
update_checkpoint_pointer = true
checkpoint_pointer = "../data/checkpoints/dense_cnn_model1_target_96x8_latest.txt"

[train]
passes_per_epoch = 1

[checkpoint]
resume_from = "/mnt/e/Hexo-BotTrainer/runs/dense_cnn_model1_target_96x8/checkpoints/epoch_000020.pt"
# Fresh run: no resume_from (the supervisor injects resume_from=<latest epoch_*.pt>
# on each relaunch; first launch has none and uses initialize_from below).
# initialize_from is the FRESH SealBot-bootstrapped prefit for THIS architecture
# (96x8 + P7), generated by scripts/_bootstrap_96x8.sh.
initialize_from = "../runs/dense_cnn_model1_target_96x8/checkpoints/bootstrap_sealbot_prefit.pt"
save_name = "latest"
