# dense_cnn_restnet_sanity_1 — minimal-moving-parts sanity run (owner directive
# 2026-06-12): does the ResTNet lineage learn properly under the parent
# dense_cnn's training regime? Strips every lever the restnet lineage added on
# top of the regime that trained stably (dense_cnn_rl_main1, 2026-06-06) and
# restores the two search semantics that changed in shared Rust since then.
#
# WHAT THIS RUN TESTS: the main_2/3/4 lengthening/flattening failures tracked
# the EXPLORATION recipe, not the heads (same heads produced too-decisive play
# under main1's sharper regime, flattening under main_2's, lengthening under
# main_3/4's). This config re-runs the lineage under the closest reproducible
# approximation of the parent's stable regime. If it learns cleanly, the levers
# are the problem; if it still degrades, the trunk/heads are back on the table.
#
# !! REQUIRES A MATURIN REBUILD (scripts/_rebuild_hexo_models_hexgt.sh) before
# launch: tss_enabled / root_fpu_zero_under_noise are new native kwargs
# (2026-06-12). NEVER rebuild while another run is live from this tree. !!
#
# Deltas vs the parent regime it mimics, all deliberate:
#   - ResTNet trunk + heads_v3 surface (that IS the experiment), minus the
#     stvalue heads: policy / value / opp_policy / moves_left only. The stvalue
#     heads grew to ~47% of the weighted gradient while diverging on main1;
#     moves_left stays (passive, training-only, prerequisite for the stage-3
#     utility) at the established 0.1 weight.
#   - Legal-masked policy CE (correctness fix matching the serve contract).
#   - C2/C3 armor stays on (mechanical-bug patches, not learning levers; C3
#     fires ~0-2 games/epoch when healthy and its counter is an early-warning
#     diagnostic). C1 ships dormant.
#   - 256 visits (owner directive; parent ran 512) — every decision is a full
#     recorded search, no PCR.

[model]
name = "dense_cnn_restnet"
module = "dense_cnn_restnet.plugin"

[model.config]
device = "cuda"

[model.config.architecture]
input_channels = 13
channels = 96
blocks_type = "R_R_R_T_R_R_T_R"
attention_heads = 4
mlp_ratio = 2
embed_kernel_size = 3
residual_conv = "hex"
attention_impl = "sdpa"
dropout = 0.0
# NO stvalue heads (sanity-run head set: policy / value / opp_policy /
# moves_left). Old restnet checkpoints will not strict-load — fresh run.
short_term_value_horizons = []
moves_left_head = true

[model.config.training]
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.1   # no stvalue heads -> inert; kept for symmetry
moves_left_weight = 0.1
amp = true
max_grad_norm = 1.0
# No PCR: every decision is a recorded row. 128 games x ~115-150 decisions
# ~= 15-19k rows/epoch; 32000 ~= 2x reuse (parent ratio ~2.6x). Owner directive
# 2026-06-12: small fast epochs for quick learning signal. The trainer clamps
# to available shuffled rows in early epochs.
train_samples_per_epoch = 32000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000
no_repeat_files = true
max_validation_samples = 100000

[model.config.samples]
# First shuffle fires after epoch 1 at the full-recording row yield.
shuffle_min_rows = 4000
# RAM-safe value (600000 crash-looped the shuffle on the 12 GB host budget).
shuffle_keep_target_rows = 300000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.4
shuffle_taper_window_scale = 50000.0
approx_rows_per_out_file = 8000
shuffle_worker_group_size = 8000
validation_fraction = 0.0
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0
# HARD z targets (parent parity; soft_z measured-destructive on the binned head
# with an immature root_value — see main_3 header change 5).
soft_z_lambda = 0.0
# C2 stays: truncated-game z=0 labels are poison in any regime.
drop_truncated_rows = true
# C1 DORMANT (knee 0 = off). Pre-authorized triggers from main_4 still apply if
# lengthening re-emerges: ml-knee -> 110.0 on dec/game > 135 x2 / > 150 once /
# raw_samples > 15000-scaled / amplitude pooled std < 0.35. NOTE raw_samples
# trigger must be re-scaled for full recording: ~44-58k rows/epoch is NORMAL
# here (the 15000 figure assumed PCR's ~25% recording) — use dec/game and the
# amplitude probe as the primary triggers for this run.
length_decay_moves_left_knee = 0.0
length_decay_moves_left_halflife = 40.0
length_decay_game_length_knee = 0.0
length_decay_game_length_halflife = 60.0

[model.config.selfplay]
# Owner directive: 256 sims, no PCR (parent ran 512 with full recording).
search_visits = 256
# = games_per_epoch (parent style: one wave, no rolling refill).
active_games = 128
# 1.4 (owner directive 2026-06-12; parent + all restnet runs used 1.5). Note
# the main_3 knob grid measured c_puct as within-noise at 1.1/1.5/2.0 on an
# ep2 checkpoint — treat this as a mild exploitation nudge, not a load-bearing
# lever.
c_puct = 1.4
root_dirichlet_noise_enabled = true
# Parent values: 0.25 / 10.83.
root_dirichlet_noise_fraction = 0.25
root_dirichlet_total_alpha = 10.83
# 1.0 = the parent's EFFECTIVE behavior: its configured 1.1 only ever applied
# to each game's first search (the reused-root bug, fixed 2026-06-10), so
# every subsequent root ran the raw prior. With the fix in place, a value of
# 1.1 would now flatten EVERY root — more flattening than the stable run
# actually had. 1.0 reproduces what it did, not what it said.
root_policy_temperature = 1.0
fpu_reduction = 0.20
# RESTORED PARENT SEMANTICS (new native kwarg, 2026-06-12): keep fpu_reduction
# active at the root even under Dirichlet noise. The hardcoded KataGo zeroing
# (rootFpuReductionMax=0, landed 2026-06-10) removed an "accidental sharpener"
# the stable parent regime trained with; main_2's flattening collapse followed.
root_fpu_zero_under_noise = false
# RESTORED PARENT SEMANTICS (new native kwarg, 2026-06-12): no Threat-Space
# Search. TSS (tactical injection + hitting-set leaf override + root guard)
# landed 2026-06-09, AFTER the parent's stable run — that run never had it.
# Pure prior-driven PUCT, like the regime being mimicked. NOTE: restnet main1
# played decisively WITH TSS on, so this can be flipped back to true as a
# single-lever A/B if defense looks too weak.
tss_enabled = false
virtual_loss = 1.0
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
mcts_session_cache_max_states = 262144
mcts_active_root_limit = 256
# LOCKSTEP: the parent's (and eval's) only scheduler. Continuous exists to
# handle PCR's heterogeneous per-move work; without PCR it is pure surface.
scheduler = "lockstep"
scheduler_flush_target = 0
adaptive_virtual_batch = false
max_actions = 1024
temperature = 1.0
# FIXED ANCHOR temperature schedule (parent parity): hot opening, 0.5 by ply
# 30, 0.3 by ply 90, final slope continues to the 0.1 floor (~ply 150), held.
# Replaces the adaptive EMA halflife — that system is a positive feedback loop
# (longer games -> higher EMA -> hotter midgame -> longer games) and was built
# as a corrective; a sanity run starts without correctives. No length_ema.json
# is read or written when the halflife fraction is 0.
temperature_schedule = [[0, 1.0], [30, 0.5], [90, 0.3]]
temperature_floor = 0.1
temperature_halflife_fraction = 0.0
# KataGo forced playouts k=2 + policy-target pruning: parent parity (it fixed
# the measured opening collapse there).
forced_playout_k = 2.0
# NO PCR (parent had none; refuted as a conversion lever anyway).
pcr_enabled = false
# Policy-init openings KEPT (owner directive 2026-06-12): 25% of games open
# with N ~ Exp(4) capped 8 plies sampled from the raw prior at T=1.4 — the
# KataGo anti-monoculture lever, never recorded as rows. Lockstep runs these
# as 1-visit probe subsets.
policy_init_fraction = 0.25
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
# C3 stays: the crop-rim frozen-win zugzwang lives in the shared Rust layer
# and this run is exposed to the same cliff if games lengthen. Fail-open,
# ~0 cost, excluded from rows; its fire counter is itself a health signal.
frozen_win_override = true

[model.config.evaluation]
# main_4-style "fancy" eval kept (owner directive 2026-06-12): 32 sealbot games
# every 5th epoch + the anchored reference ladder. CAVEAT — main_3/main_4
# checkpoints CANNOT be anchors here: they carry stvalue heads this
# architecture dropped, and anchors strict-load with the CURRENT architecture
# (fail-open per anchor, but they would fail every eval). So the ladder is
# staged: once this run has its own early checkpoint, set e.g.
#   reference_checkpoints = [".../dense_cnn_restnet_sanity_1/checkpoints/epoch_000005.pt"]
#   reference_games = 32
# via config bounce — a fixed own-lineage anchor, same role main_3 ckpt5
# played for main_4. reference_games stays 0 until then (0 = phase fully off).
games_per_epoch = 32
eval_every = 5
sealbot_variant = "best"
sealbot_time_limit = 0.05
max_actions = 1024
require_sealbot = true
opening_temperature = 0.6
opening_moves = 8
reference_games = 0

[model.config.performance]
calibrate = true
target_selfplay_positions_per_second = 16.0
inference_batch_candidates = [128, 256, 512]
selfplay_batch_candidates = [128]   # = selfplay.active_games
training_batch_candidates = [16, 32]
mcts_virtual_batch_candidates = [4]
selfplay_probe_positions = 2048
probe_batches = 1
inference_use_tensorrt = false
# Full main_4 performance stack kept (owner directive 2026-06-12): fp16 +
# torch.compile + KV-gather, all correctness-gated at init exactly as on the
# live main_4 run.
inference_fp16_model = true
inference_fp16_allow_fallback = false
inference_use_torch_compile = true
inference_compile_allow_torch_fallback = true
attention_kv_gather = true
inference_bucket_pad_multiple = 16

[run]
name = "dense_cnn_restnet_sanity_1"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/dense_cnn_restnet_sanity_1"
seed = 1

[loop]
epochs = 40

[selfplay]
# 128 games/epoch in ONE wave (active_games = 128, no refill; owner directive
# 2026-06-12: fast epochs). All decisions recorded (no PCR): ~15-19k rows/epoch
# at the historical 115-150 decision lengths.
games_per_epoch = 128
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# Short prefit warm start (owner directive 2026-06-12): 4 passes over the 1,977
# recorded rows of main_3 epoch-5 games shorter than 80 decisions (163 of 384
# games; the healthy decisive slice — real 512-visit search policy targets,
# hard z, real moves_left). Built by scripts/_wf_sanity1_bootstrap.py against
# THIS head set (no stvalue); prefit loss 6.43 -> 4.86; strict-load verified.
# Weights-only (initialize_from ignores optimizer/train state).
initialize_from = "/mnt/e/Hexo-BotTrainer/runs/dense_cnn_restnet_sanity_1_prefit/restnet_sanity1_prefit.pt"
save_name = "latest"
