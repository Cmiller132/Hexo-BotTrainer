# hexfield_eq_main_1 — FIRST self-play run of the D6-equivariant rewrite lineage
# (packages/hexfield_eq: 25-plane graded window features, x12 regular-rep tied
# trunk, orbit/joint-tied bias, register lane / ray attention per the arm ladder).
#
# STATUS: PRE-LAUNCH SCAFFOLD. Do not start until the BC-prefit ladder has a
# winner and the gates in docs/DEPLOYMENT_CHECKLIST_HEXFIELD_EQ.md are green
# (prefit go/no-go = PLAN_D6_EQUIVARIANT_REWRITE.md Phase 4; ladder =
# PLAN_REGISTER_LANE_RAY_ATTENTION.md §3).
#
# ARCHITECTURE ENV lives in scripts/systemd/hexfield-eq-supervisor-1.service
# (convention: arch via service env, data+training via toml):
#   HEXFIELD_EQ_CHANNELS=192  HEXFIELD_EQ_GROUP_ORDER=12  HEXFIELD_EQ_C_ORBIT=16
#   HEXFIELD_EQ_ATTENTION_HEADS=3  HEXFIELD_EQ_SUPPORT_RADIUS=4
#   HEXFIELD_EQ_TRUNK=<prefit-ladder winner>  HEXFIELD_EQ_REG_LANE=<winner>
#   HEXFIELD_EQ_REG_TOK_READ=<winner>
# The checkpoint meta (model.arch_meta) is the authoritative self-description;
# these envs pick the default build and MUST match the prefit winner exactly.
#
# SEARCH/TARGET REGIME: copied from hexfield_main_11 (Gumbel completedQ
# sharp-target, 256 visits, 100% PCR, de-contaminated search: 0 Dirichlet /
# 0 forced playouts / constant c_puct) — the regime the prefit corpus was
# generated under and the verified fix for the main_10 visit-target regression.
#
# EVAL RE-ANCHOR (decision D4, PLAN_D6_EQUIVARIANT_REWRITE.md Phase 5): the
# 15-plane main5/main6 permanent anchors are DROPPED (a 25-plane process cannot
# serve them; strict load fails on the stem shape). permanent_anchors = [] and
# the pool pins on Strix + SealBot + this run's own self-anchors.

[model]
name = "hexfield_eq"
module = "hexfield_eq.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 256
# 100% PCR: every turn is a full move with a written Gumbel-target row.
pcr_full_proportion = 1.0
pcr_fast_visits = 192
pcr_fast_temperature = 0.0
# 384 -> 256 (2026-07-09, with [selfplay] games_per_epoch 512 -> 256): tighter
# epoch cadence; active_root_limit kept equal to active_games.
active_games = 256
# 48 -> 96 (2026-07-09 fast-profile tuning): the eq net is ~2.75x the FLOPs of
# the 128c net vbs=48 was swept on; measured ~15.0 vs ~14.5 pos/s marginal on
# the live soak (submit-bound at 48: GPU util bursty 41-97%). Mirrored in the
# generated launch toml in the prefit run dir.
virtual_batch_size = 96
flush_target = 1024
active_root_limit = 256
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144
nucleus_f64 = true
lcb_z = 1.6
clean_root_prior_cache = true

# ---- Search c_puct (constant; visit-scaling neutralized, main_11 regime) ----
c_puct = 1.5
visit_scaled_c_puct = true
c_scale = 0.0
c_base = 500.0
# De-contaminated target search: zero root Dirichlet, zero forced playouts.
root_dirichlet_noise_fraction = 0.0
root_dirichlet_total_alpha = 10.83
dirichlet_shaped = true
fpu_reduction = 0.2
root_fpu_reduction = 0.0
forced_playout_k = 0.0
pruned_dynamic_cpuct = true
lazy_widening = true
new_child_fpu = true
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
temperature = 1.0
temperature_floor = 0.15
temperature_halflife_plies = 20.0
root_policy_temperature = 1.05
policy_init_fraction = 0.35
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
ml_two_sided = false
ml_final_pick_band = 0.08
export_root_prior_logits = true

# ---- Gumbel AlphaZero (main_11 target regime; m=16 fits 256 visits exactly) ----
gumbel_root_enabled = true
gumbel_sequential_halving = true
gumbel_nonroot_select = true
gumbel_target_enabled = true
gumbel_c_visit = 50.0
gumbel_c_scale = 1.0
gumbel_m = 16
gumbel_target_min_visits = 1
gumbel_play_prune = true

[model.config.training]
batch_rows = 256
learning_rate = 5e-4
weight_decay = 1e-4
grad_clip = 5.0
adaptive_clip = true
clip_c = 1.75
clip_ema_decay = 0.99
clip_warmup_steps = 50
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.1
moves_left_weight = 0.2
q_head_weight = 0.1
soft_policy_weight = 0.5
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0
warmup_steps = 0
# LR schedule (config-gated, trainer.scheduled_lr): warmup 400 steps, cosine to
# lr_final by epoch 60, hold. lr_final 4e-4 -> 1e-4 (2026-07-09): 5x decay,
# prefit's LR -> LR/10 shape, vs main_11's shallow 20% decay. Watch the hold:
# if eval strength is still climbing steeply at epoch 60, raise lr_final.
lr_schedule = "cosine"
lr_warmup_steps = 400
lr_final = 1e-4
lr_decay_epochs = 60
shuffle_min_rows = 7000
shuffle_keep_target_rows = 210000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.8
shuffle_taper_window_scale = 7000.0
validation_fraction = 0.0
# 144000 -> 56000 (2026-07-09 re-derivation): games_per_epoch 512 -> 256 halved
# fresh rows/epoch to ~24-27k; 144k pinned lifetime reuse (= samples/fresh) at
# ~5.8 vs the regime-verified 2.6-2.9. Eq discount below strict parity (72k):
# augmentation-coverage reuse is gone (one tied visit = the exact 12-orientation
# orbit-averaged gradient), so target reuse ~2.2 => 56k (~219 steps/epoch).
train_samples_per_epoch = 56000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000.0
no_repeat_files = false
expand_backend = "rust"
expand_workers = 0
# The Gumbel completedQ improved-policy target (pi' = softmax(logits + sigma(Q))).
policy_target = "gumbel"

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5

[model.config.multi_stage_eval]
enabled = true
games_budget = 192
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 32
# Re-anchored pool (D4): Strix + SealBot zero-points get a larger combined share
# than main_11 since there are no permanent checkpoint anchors; the rest of the
# budget goes to the sliding self-anchor bracket once epochs exist.
sealbot_share = 0.1667
strix_share = 0.3333
strix_weight = 1.0
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
enabled = false

[model.config.multi_stage_eval.opponents]
sealbot_enabled = true
strix_enabled = true
# Stable anchor location (checklist B6, relocated 2026-07-08). The original
# copy in /mnt/c/Users/epicm/Downloads/ still exists as a backup.
strix_ckpt = "/mnt/e/Hexo-BotTrainer/anchors/strix/checkpoint_00237000.pt"
# Match the candidate's eval budget (full_search_visits = 512), as in main_11.
strix_sims = 512
strix_m = 16
strix_device = "cuda"
strix_label = "strix"
bracket_size = 2
# DECISION D4 (PLAN_D6_EQUIVARIANT_REWRITE.md): NO permanent 15-plane anchors.
# The pool is Strix + SealBot + this run's own log-grid self-anchors. Do NOT
# point this at main5/main6 checkpoints — a 25-plane process cannot build them.
permanent_anchors = []
radius8_opponents = []

[run]
name = "hexfield_eq_main_1"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/hexfield_eq_main_1"
seed = 1

[loop]
epochs = 200

[selfplay]
games_per_epoch = 256
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# WARM START from the BC-prefit ladder WINNER (fresh governor / epoch 0,
# tolerant non-strict load — the prefit payload's "model" state dict is the
# same arch when the service env matches the winning arm). SET THIS to the
# winning arm's best epoch before first launch, e.g.:
# initialize_from = "/mnt/e/Hexo-BotTrainer/runs/hexfield_eq_prefit/arm2_reglane/checkpoint_epoch3.pt"
save_name = "latest"
