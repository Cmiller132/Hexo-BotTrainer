# Eval-speed variant of hexfield_main_1: IDENTICAL search knobs EXCEPT
# virtual_batch_size=16 (4->16) to cut MCTS forward-rounds ~4x (the eval is
# round/latency-bound, not throughput-bound, at vbs=4). For calibrating the
# in-run statistically-significant eval (72 games, <=30 min). Used by the
# multistage eval runner (--config), which reads only [model.config.*].
[model]
name = "hexfield"
module = "hexfield.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 512
pcr_full_proportion = 0.33
pcr_fast_visits = 128
active_games = 64
c_puct = 1.5
virtual_batch_size = 16
flush_target = 1024
active_root_limit = 128
root_dirichlet_total_alpha = 10.83
root_dirichlet_noise_fraction = 0.25
fpu_reduction = 0.2
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
forced_playout_k = 2.0
policy_init_fraction = 0.25
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
temperature = 1.0
temperature_floor = 0.1
temperature_halflife_plies = 30.0
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144

[model.config.training]
batch_rows = 32
learning_rate = 1e-3
weight_decay = 1e-4
shuffle_keep_target_rows = 32000

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5
