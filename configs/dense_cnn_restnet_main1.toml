# dense_cnn_restnet_main1 — faithful ResTNet (interleaved residual + transformer
# trunk; IJCAI 2025 arXiv:2410.05347), WARM-STARTED from the HF human-corpus
# prefit (see [checkpoint] below). Owner directives 2026-06-09.
#
# Architecture (faithful to the released code, github.com/rlglab/restnet):
#   - 96 channels, 8 blocks, R3-family interleave.
#   - blocks_type = "R_R_R_T_R_R_T_R": 3 leading residual blocks, then a
#     transformer block every 3rd, ending residual (RRR T RR T R). 2 transformer
#     blocks. The paper's canonical 10-block R3(RRT) is "R_R_R_T_R_R_T_R_R_T"
#     (3 T-blocks) if a deeper trunk is ever wanted.
#   - Attention runs at the package default scope "disk" (Spec C): the 420
#     out-of-crop corner KEY columns carry a static large-negative additive bias,
#     so attention is over the radius-20 hex disk's 1261 cells; queries are
#     unrestricted. attention_impl "sdpa" computes the identical math to the
#     materialized oracle memory-efficiently (no windowing/downsampling).
#   - heads/loss/replay are the dense_cnn binned-value contract (kept), so the
#     existing pipeline, MCTS, and replay schema are reused unchanged.
#
# Native accelerator: hexo_models._rust.dense_cnn, REBUILT 2026-06-09 with the
# radius-20 hex-disk crop contract (encoding.rs zero_corner_cells +
# sample_gen.rs in-disk legal/policy), matching the Python expansion path
# (input.py / geometry.in_disk) cell-for-cell.
#
# NOTE (throughput, non-goal but plan for it): the attention trunk is much slower
# than the conv-only dense_cnn run. Measured at epoch ~17: ~22 pos/s self-play,
# ~8.4k recorded rows / 256-game epoch (~6.5 min self-play). If calibration OOMs
# or self-play degrades, the owner may lower active_games / search_visits /
# inference_batch_candidates — none of which change the architecture.

[model]
name = "dense_cnn_restnet"
module = "dense_cnn_restnet.plugin"

[model.config]
device = "cuda"

[model.config.architecture]
input_channels = 13
channels = 96
blocks_type = "R_R_R_T_R_R_T_R"   # 8-block R3-family default (OWNER: confirm)
attention_heads = 4
mlp_ratio = 2
embed_kernel_size = 3
residual_conv = "hex"             # hex-masked 3x3 (board-correct); "plain" = literal paper conv
attention_impl = "sdpa"           # identical math to "materialized", memory-efficient
dropout = 0.0
# Lookahead horizons in DECISIONS, turn-aligned: every turn after the opening is
# TWO placements by the same player, the target EMA steps over full turns (even
# offsets — see samples._short_term_value_targets), and horizons must be even
# (config-validated). [2, 6, 16] = 1 / 3 / 8 turns of effective lookahead
# (owner 2026-06-09 late evening: fix properly, no horizon-1 head). These keys
# never appeared in this run's old shards ({1,4,8}), so via the horizon-UNION
# shuffle the old rows train these heads on nothing — all three start on clean,
# turn-aligned targets from relaunch onward.
short_term_value_horizons = [2, 6, 16]
# Auxiliary moves-left head: predicts decisions remaining (binned over
# [0, MOVES_LEFT_CAP] on the shared value reduction). Training-only; teaches
# urgency and exposes the game-length dynamics to the trunk.
moves_left_head = true

[model.config.training]
# 32 (was 256): full 1681-token attention fwd+bwd is heavy. MEASURED on the 12 GB
# RTX 4070 Ti: batch 32 ~8.2 GB (fits), batch 64 ~16 GB (OOMs). 256 OOMs instantly.
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
# 0.1 (was 0.25): at 0.25 x 3 horizons the lookahead heads were ~47% of the
# weighted loss at epoch ~19 — while their losses were RISING (targets are
# search-derived and non-stationary; the heads also restart from a remapped
# shared reduction after the heads_v2 migration). 0.1 keeps the auxiliary
# shaping signal at a sane ~15-20% share during re-convergence.
short_term_value_weight = 0.1
# Moves-left auxiliary (remaining decisions, binned): cheap exact targets.
moves_left_weight = 0.1
amp = true
max_grad_norm = 1.0
# 32000 (was 8000): rows trained per epoch, drawn from the fresh KataGo shuffle
# of the replay window. MEASURED at epoch ~17: self-play generates ~8.4k rows /
# 256-game epoch (~33 rows/game), so 8000 was ~1.0x the generation rate — each
# position was trained about once over its whole window lifetime, the bottom of
# the AlphaZero/KataGo range (~1-4x) and an under-use of the expensive
# full-attention self-play games. 32000 ~= 3.8x generation: each position is
# trained ~4x over its lifetime (KataGo's customary ceiling; the train bucket at
# 8x/new-row stays above it, and still gates if self-play ever stalls). Cost:
# ~1000 steps @ batch 32, measured ~140 rows/s => ~4 min/epoch vs ~6.5 min
# self-play, so training remains the minority cost. The pass needs >=32k rows in
# the shuffle output: satisfied from the current ~140k-row window; only a
# from-scratch restart would skip the first ~4 epochs while the window fills.
train_samples_per_epoch = 64000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000
no_repeat_files = true
max_validation_samples = 100000

[model.config.samples]
# 8000 (was 100000): the SHUFFLE-build floor (total self-play rows needed before
# a shuffled window is built at all). One 256-game epoch records ~8.4k rows
# (measured), so the first shuffle fires right after epoch 1 (owner 2026-06-09:
# don't wait for 100k, train on what's there). Note the train pass itself is
# gated separately by train_samples_per_epoch above.
shuffle_min_rows = 8000
shuffle_keep_target_rows = 300000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.4
shuffle_taper_window_scale = 50000.0
approx_rows_per_out_file = 8000
shuffle_worker_group_size = 8000
validation_fraction = 0.0
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0

[model.config.selfplay]
# 512 (was 256): finer policy targets (256 visits over up to 96 children left
# the median child 0-3 visits). Roughly doubles per-position search cost —
# expect self-play pos/s to drop toward ~11-13 (owner 2026-06-09 evening).
search_visits = 512
# 128 (was 256): fewer concurrent games bounds self-play VRAM + tree memory for the
# heavy full-attention model. games_per_epoch below matches (single wave).
active_games = 128
c_puct = 1.5
root_dirichlet_noise_enabled = true
root_dirichlet_noise_fraction = 0.25
root_dirichlet_total_alpha = 10.83
root_policy_temperature = 1.1
fpu_reduction = 0.20
virtual_loss = 1.0
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
# 262144 (was 131072): the eval cache saturated at the old cap every epoch
# (cache_size_peak == cap, ~15% hit rate). Doubling costs ~0.5 GB RAM at the
# measured ~4 KB/state and buys back repeat evaluations.
mcts_session_cache_max_states = 262144
mcts_active_root_limit = 256
# Scheduler: PRODUCTION = "lockstep" (verified best 2026-06-10). Offline A/B on
# the epoch-30 checkpoint with all GPU levers (fp16 + KV-gather + compile, both
# exact + compile-adopted, 2048-position probe) measured lockstep 8.92 vs
# continuous 8.81 pos/s — lockstep ~1.2% faster and simpler/proven. At the
# current 512-visit / 128-game config lockstep's synchronized rounds already
# batch ~410 states, so the continuous scheduler's per-move callback/slot
# overhead slightly outweighs its staggered-completion bubble savings (the
# "avg batch 54" motivation held only at the old 256-visit config). The
# continuous path (run_continuous + scripts/_continuous_ab_gate.py) is retained,
# additive and gated, for comparison only — set "continuous" to re-enable.
scheduler = "lockstep"
scheduler_flush_target = 0
max_actions = 1024
temperature = 1.0
# Adaptive temperature decay (replaces the absolute-move anchor schedule, which
# was tuned for ~90-decision games — at the measured ~31-decision games it kept
# EVERY move at temp >= 0.5 and the endgame never sharpened). The played-move
# temperature decays exponentially with a half-life of 25% of the expected game
# length, where the expectation is an EMA of measured mean decisions/game
# (selfplay/length_ema.json; seeded by temperature_length_prior on a fresh run).
# At L=32: ply 0 -> 1.0, ply 8 -> 0.5, ply 16 -> 0.25, ply 24 -> 0.125, floor
# 0.1 — hot opening (~4 turns), decisive endgame, and the scale follows the
# games automatically as they lengthen.
temperature_halflife_fraction = 0.25
temperature_length_prior = 32.0
temperature_floor = 0.1
# Opening-diversity anchor (self-play, added 2026-06-10; opening_moves 8->5 on
# owner directive). Hold a flat, higher played-move temperature over the first
# `opening_moves` PLIES so the opening diversifies BEFORE the adaptive half-life
# decay takes over; it is a floor (max(opening_temperature, adaptive_base)) so it
# never sharpens the opening below the base curve. UNIT: self-play applies one
# PlacementAction per decision, so move_index = len(actions) = ply index; thus
# `opening_moves` is counted in PLIES (1 action = 1 placement = 1 ply). The opening
# collapse ("origin + n=8-edge") is prior-driven, so the anchor must be meaningfully
# higher than the adaptive opening (~0.8-1.0) to spread selection — 1.4 per the
# opening-diversity analysis (recommended 1.3-1.5). opening_moves=5 covers move_index
# 0..4 = the first 5 plies; ply 0 is the forced origin (single legal move, so the
# anchor is a no-op there) and plies 1-4 are the first free decisions it diversifies.
# At expected length ~97 (half-life ~24 plies): plies 0-4 held flat at 1.4, then
# adaptive resumes (~0.87 at ply 5, 0.5 at ply 24, ... floor 0.1).
opening_temperature = 1.4
opening_moves = 5
forced_playout_k = 2.0

[model.config.evaluation]
games_per_epoch = 64
eval_every = 3
sealbot_variant = "best"
sealbot_time_limit = 0.05
max_actions = 1024
require_sealbot = true
opening_temperature = 0.6
opening_moves = 8

[model.config.performance]
calibrate = true
target_selfplay_positions_per_second = 16.0   # full-attention trunk: expect low pos/s (non-goal)
# Inference-only forwards are far lighter than training fwd+bwd (the old
# [32,64,128] cap came from training-memory measurements); fp16 halves them
# again. Batch 512 fp16 verified on the 4070 Ti 2026-06-10. The calibration OOM
# guard still drops any candidate that OOMs and keeps the fastest viable.
inference_batch_candidates = [128, 256, 512]
selfplay_batch_candidates = [128]
training_batch_candidates = [16, 32]
mcts_virtual_batch_candidates = [4]
selfplay_probe_positions = 2048
probe_batches = 1
inference_use_tensorrt = false   # attention does not export to TRT cleanly; torch backend
# Pure-fp16 folded inference model (no per-call autocast). Correctness-gated at
# construction on real positions, fail-loud (gate measured 2026-06-10:
# argmax_match=1.0000, decoded value err=0.0026 vs the fp32/autocast reference).
inference_fp16_model = true
inference_fp16_allow_fallback = false
# torch.compile(reduce-overhead) CUDA-graph forward, correctness-gated vs eager
# on real positions. ENABLED 2026-06-10 (owner: GPU-only throughput levers, no
# quality change). fallback ON so a compile/capture failure logs loudly and runs
# eager rather than halting the live run; the gate still proves equivalence when
# it adopts. Mutually exclusive with TRT.
inference_use_torch_compile = true
inference_compile_allow_torch_fallback = true
# KV-gathered disk attention: SDPA over the 1261 in-disk keys, proven
# bit-equivalent to the -1e9 dense key mask (tests/test_dense_cnn_restnet_attention,
# atol 1e-5). ENABLED 2026-06-10 alongside compile; eval/no-grad path only.
attention_kv_gather = true
inference_bucket_pad_multiple = 16

[run]
# OWNER: confirm output_dir matches your environment's mount (mirrors the live
# dense_cnn run's prefix; the run name is new, so it is isolated from
# dense_cnn_rl_main1).
name = "dense_cnn_restnet_main1"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/dense_cnn_restnet_main1"
seed = 1

[loop]
epochs = 60

[selfplay]
# 256 (was 128). With active_games=128 this is a ROLLING epoch (128 in flight,
# refilled to 256 total), NOT the single-wave active==games case. MEASURED yield:
# ~8.4k recorded rows / 256-game epoch (~33 rows/game — games are shorter than
# the ~80-row/game pre-launch estimate), which is what the train_samples_per_epoch
# reasoning above is calibrated against.
games_per_epoch = 256
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# WARM START from the HuggingFace human-corpus prefit (BC on 6902 human games ->
# ~431k samples; see scripts/bootstrap_dense_cnn_restnet_hf.py). initialize_from
# loads ONLY the weights — DenseCNNCheckpointLoader detects the initialize-only
# case (resume_from unset) and skips the checkpoint's optimizer/train state, so
# RL starts at epoch 1 with a fresh AdamW. (The first launch of this run, before
# 2026-06-09 evening, predated that guard and did import the prefit's Adam
# moments; harmless by now — they were overwritten within a few epochs.) The
# supervisor injects resume_from=<latest epoch_*.pt> on crash-relaunch, which
# takes precedence and restores optimizer + train state as a true resume.
initialize_from = "/mnt/e/Hexo-BotTrainer-hexgt/runs/dense_cnn_restnet_main1_prefit/restnet_hf_prefit.pt"
save_name = "latest"
