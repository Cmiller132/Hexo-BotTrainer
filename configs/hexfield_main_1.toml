# hexfield production run 1 (owner directive 2026-06-12): 512 visits,
# PCR fast=128 at 33% full. Quarantined knobs OFF (spec §5.1), §5.4
# divergences ON (defaults). Run dir on the dashboard mount so the :8080
# History screen renders it natively. Warm-start: the BC prefit (spec §7).

[model]
name = "hexfield"
module = "hexfield.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 512
pcr_full_proportion = 0.33
pcr_fast_visits = 128
active_games = 64
c_puct = 1.5
virtual_batch_size = 4
# flush_target must be ABOVE max in-flight (active_games*virtual_batch_size) so
# the flush is select-exhaustion-driven, not a stall waiting for an unreachable
# full batch (flush_target==in-flight HANGS; <in-flight caps the batch small).
# Empirically (probe sweep): batch size scales with active_games, throughput
# plateaus ~64 games (evals/s GPU-saturated ~772). 0 is rejected by validation.
flush_target = 1024
active_root_limit = 128
root_dirichlet_total_alpha = 10.83
root_dirichlet_noise_fraction = 0.25
fpu_reduction = 0.2
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
forced_playout_k = 2.0
policy_init_fraction = 0.25
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
temperature = 1.0
temperature_floor = 0.1
temperature_halflife_plies = 30.0
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144

[model.config.training]
batch_rows = 32
learning_rate = 1e-3
weight_decay = 1e-4
shuffle_keep_target_rows = 32000

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
# The lockstep arena is single-game/slow; over a long run evaluate periodically
# (the eval ladder is for tracking strength, not a per-epoch gate).
eval_every = 5

# In-run COMPARABLE strength eval (eval-v2), wired into evaluate_epoch. Replaces
# the 16-game vs-prior arena with 72 paired games vs a FIXED roster (permanent
# anchors bc_prefit + ep5, sliding bracket, L-lag champion), pooled into a
# persisted Bradley-Terry ladder so epochs compound into an apples-to-apples
# learning curve. LOCKED + UNIFORM for comparability: 512 sims, eval-vbs 16.
# PURE EVAL (reports a label; never gates/halts/promotes). Runs every epoch.
[model.config.multi_stage_eval]
enabled = true
# Eval only every 5th epoch (was 1) and with fewer games (was 72) so it stops
# dominating wall-clock. 40 games / 5 opponents = ~8 games (4 CRN pairs) each;
# the champion edge (contested long games) is the slow tail, so fewer games
# roughly halves per-eval time. 512 visits + vbs16 are KEPT so every point stays
# comparable with the ep10-30 pool (the learning curve would break at mixed
# visits). The pool compounds, so the 5-epoch cadence still grows a clean curve.
games_budget = 40
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 16
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
# SPRT OFF: the --parts path skips Stage B anyway; off keeps the champion edge at
# the uniform per-opponent game count (no SPRT-dependent variation) for comparable graphs.
enabled = false

[model.config.multi_stage_eval.opponents]
# SealBot unavailable in this env (no SEALBOT_PATH/binary) -> BT pool anchors on
# bc_prefit. permanent_anchors / log_grid / bracket_size left at dataclass defaults
# so backfilled and live edges share identical roster rules.
sealbot_enabled = false

[run]
name = "hexfield_main_1"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_1"
seed = 1

[loop]
epochs = 200

[selfplay]
games_per_epoch = 192
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
initialize_from = "/mnt/e/Hexo-BotTrainer-hexgt/runs/hexfield_bc_1/checkpoint_epoch2.pt"
save_name = "latest"
