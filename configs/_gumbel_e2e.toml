# hexfield_main_6 — FULL Gumbel AlphaZero (Danihelka et al., ICLR 2022).
# Copied from hexfield_main_5.toml; the ONLY behavioral deltas are the Gumbel
# knobs below (now ENABLED), plus the run identity / warm-start. PREPARE-ONLY
# (this config is launch-ready but nothing is launched from this worktree).
#
# ==========================================================================
# WHAT main_6 ADDS vs main_5 — the Gumbel profile (all behind divergence flags):
# ==========================================================================
#   [model.config.selfplay] gumbel_* knobs (ENABLED here — the full profile):
#     #1 root  : gumbel_root_enabled (Gumbel-Top-k sampling of m candidates) +
#                gumbel_sequential_halving (root-only SH visit allocation).
#     #2 select: gumbel_nonroot_select (deterministic argmax[logits+sigma(Q)]).
#     #3 target: gumbel_target_enabled (improved-policy training target) +
#                export_root_prior_logits (carry raw policy logits to Rust).
#     sigma(q)=(gumbel_c_visit + max_b N(b))*gumbel_c_scale*q ; gumbel_m
#     candidates ; gumbel_target_min_visits = target support floor.
#   [model.config.training] policy_target = "gumbel" — train the main policy head
#     against the #3 improved-policy target pi'=softmax(logits+sigma(completedQ)).
# This == Divergences::gumbel() (production() with the four gumbel bools flipped
# true). To bisect a regression, flip individual gumbel_*_enabled flags back to
# false (and policy_target back to "visit") — each one independently disables its
# mechanism and the Rust path falls back to the main_5 PUCT/visit behavior.
#
# WARM-START: a healthy, post-plateau main_5 c=128 checkpoint (epoch_000117, the
# newest available — see [checkpoint]). Gumbel changes only SEARCH + the policy
# TARGET, not the net SHAPE, so the main_5 net loads as-is via the tolerant
# initialize_from path. This is a FRESH run (new governor / train bucket), NOT a
# resume — main_5's optimizer state is intentionally dropped.
#
# Below: the unchanged main_5 header (preserved for the audit trail).
# ==========================================================================
#
# hexfield production run 4 (KATAGO-FAITHFUL build). FRESH run, copied from
# hexfield_main_3.toml. PREPARE-ONLY: this config exists so main_4 can be
# launched later; the live hexfield_main_3 run is NOT touched.
#
# ==========================================================================
# WHAT CHANGED vs hexfield_main_3 (and why) — every delta is enumerated here:
# ==========================================================================
#
# [run] / [checkpoint] — identity + warm-start:
#   - name -> "hexfield_main_4", output_dir -> .../runs/hexfield_main_4.
#   - This is a FRESH run, NOT a resume. The new KataGo soft-policy head (and
#     the per-block bias migration already in the arch) means the checkpoint
#     SHAPE differs from any prior net. initialize_from still points at the v3
#     BC prefit (same as main_3); the soft_policy head has NO weights there, so
#     the checkpoint loader's initialize_from/BC path fresh/zero-inits the new
#     head (tolerant non-strict load — the `resume` path stays strict).
#     warmup_steps=0 (fresh-governor warm start).
#
# [model.config.selfplay] — KataGo-faithful search (NEW, all behind divergence
#   flags that resolve to Divergences::production() in production self-play;
#   the M5/M6 golden-vector parity tests run Divergences::parity() and stay
#   byte-identical):
#   - Dynamic c_puct + LCB knobs now FIRST-CLASS / config-auditable
#     (c_base=500.0, lcb_z=1.6 unchanged; the wiring gap is closed — Python
#     never emitted these before though Rust read them).
#   - c_scale=0.0 (CHANGED from 0.45): KataGo SELF-PLAY uses cpuctExplorationLog
#     =0.0; 0.45 is the analysis/strength tunable. The log/visit-scaled c_puct
#     term is now inert, so c_puct is constant. c_puct itself kept at 1.5 (strict
#     self-play faithful = 1.1; pending owner decision — see the selfplay block).
#   - root_policy_temperature: 1.1 with early=1.25, halflife=19 (CHANGED from
#     flat 1.07) to match KataGo self-play (rootPolicyTemperature=1.1,
#     rootPolicyTemperatureEarly=1.25); flattens the opening prior more, decaying
#     to 1.1.
#   - root_fpu_reduction=0.0 (SPEC CORRECTION, ledger [6]): modern KataGo has
#     NO "zero FPU under noise" branch; self-play uses rootFpuReductionMax=0.0.
#     This first-class root FPU replaces the noise-conditioned mechanism.
#     root_fpu_zero_under_noise=false keeps the legacy branch inert (it is kept
#     only for the parity path / golden vectors).
#   - fpu_reduction=0.2 (interior FPU) UNCHANGED.
#   - Six KataGo-faithful search divergences flipped ON (they are already ON in
#     production(); set here for audit + individual control):
#       nucleus_f64=true            (f64 cumulative + mass>=1.0 sentinel)
#       new_child_fpu=true          (new-child = fpu + U, not U-only)
#       lazy_widening=true          (live can_widen check; no frozen cap)
#       clean_root_prior_cache=true (no Dirichlet/temp re-mix compounding)
#       dirichlet_shaped=true       (KataGo computeDirichletAlphaDistribution)
#       pruned_dynamic_cpuct=true   (exported target uses c_for(N), not static)
#     new_child_fpu and lazy_widening are COUPLED (the lifted cap makes FPU the
#     sole gate); both ON here.
#
# CONFIG-REVIEW changes (55-agent per-knob CPU critique, Hexo-vs-Go, owner-adjusted)
# — these tune for Hexo's measured conversion-failure/defensive-lock + sudden-death,
#   and several DELIBERATELY DIVERGE from KataGo self-play (Go-isms that hurt Hexo):
#   - root_dirichlet_noise_fraction 0.25 -> 0.20 (exploration not the bottleneck).
#   - forced_playout_k 2.0 -> 1.0 (k=2 over-sprays Hexo's flat prior; gentle floor
#     kept; do NOT set 0 — it also kills target pruning + the discovery channel).
#   - temperature_halflife_plies 60 -> 45 (more committal mid/endgame for conversion).
#   - root_policy_temperature_early 1.25 -> 1.15 (gentler opening flatten; steady
#     stays 1.1; KataGo's 1.25 over-flattens an opening Dirichlet already saturates).
#   - pcr_fast_visits 128 -> 192 (cut fast-move conversion blunders; throughput-gated).
#   - moves_left_weight 0.1 -> 0.2 (feed the ml-utility decisiveness lever).
#   - learning_rate 3e-4 -> 5e-4 (owner; hotter early lr for a fresh run).
#   - c_puct KEPT 1.5 (config-review: low-stakes; forced playouts dominate discovery,
#     not c; KataGo's 1.1 assumes a wide score-Q Hexo lacks).
#
# [model.config.training] — KataGo auxiliary SOFT policy target (NEW), HEXO-ADAPTED:
#   - soft_policy_weight=4.0 (HALVED from KataGo's 8.0). Train-only soft_policy head;
#     soft target derived in collate_training from the visit policy (NO shard /
#     replay_expand.rs change). HEXO ADAPTATION (config-review): KataGo's ^0.25 (T=4)
#     over the FULL legal set leaks ~40-72% of soft-target mass onto Hexo's huge
#     unvisited-legal tail (savage in sudden-death), so the target is p^0.5 (T=2),
#     SUPPORT-ONLY (no full-legal 1e-7 floor); weight halved to 4.0 to match the
#     sharper target's larger gradient. (batching.collate_training + losses.py.)
#
# KEPT verbatim from main_3 (NOT changed): search_visits=512, c_puct=1.5,
#   root_dirichlet_total_alpha=10.83, widening_policy_mass=0.95,
#   widening_max_children=96 (still passed but with lazy_widening ON the live
#   can_widen check is the real gate — kept for the parity path / for flipping
#   lazy_widening off), widening_min_children=2, temperature=1.0/floor=0.15,
#   max_game_plies=256, ml_two_sided=false, ml_final_pick_band=0.08, the full
#   replay-buffer block, train_samples_per_epoch=48000.
#   expand_backend="rust" — and now CORRECT. The merge of claude/hexfield-cleanup
#   (merge commit on this branch) fixed the rust-expand value_mask bug:
#   replay_expand.rs now READS outcome_valid and EMITS value_mask (0.0 for truncated
#   rows, zeroing stvalue_mask/cell_q_mask; 1.0 for completed), and expand_backends.py
#   consumes result["value_mask"] (no more np.ones fallback). So truncated-game value
#   masking from b8a9f43 is ACTIVE under rust — no need to switch to serial/pool.
#   (NOTE: the live main_3 run still has this bug — it runs the pre-fix rust kernel.)
#
# Owner decisions baked in (per ledger open_decisions): own-conv soft head
#   (Hexfield per-head-conv adaptation), player-only soft policy (no opp-soft),
#   lazy_widening + new_child_fpu both ON, tolerant-load of the existing v3
#   prefit, no cpuctUtilityStdevScale per-node variance state. c_puct kept at 1.5
#   (strict self-play faithful = 1.1) pending an explicit exploration-vs-
#   faithfulness decision.

[model]
name = "hexfield"
module = "hexfield.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
# search_visits = 1024 (KEPT from main_5). For Gumbel this is the Sequential-
# Halving BUDGET n distributed over m=16 candidates in R=ceil(log2(m))=4 rounds
# (~256 visits/round; the final 2 survivors each accumulate ~256+). 1024 is a
# good Gumbel budget here: m=16 with n=1024 gives a deep per-survivor allocation
# (Danihelka show Gumbel matches/beats PUCT at EQUAL sims, and the SH guarantee
# of policy improvement holds for any n>=m), and Hexo branching is 337->~1000 and
# GROWS late-game (LEGAL_RADIUS=8 halo) so SH never starves a round. We do NOT
# raise it for Gumbel: the whole point of Gumbel-MCTS is sample-efficiency, so
# matching main_5's 1024 makes main_6-vs-main_5 a clean equal-budget comparison.
# Fast PCR moves keep 192 visits (they do NOT use SH — fast roots fall back to
# the normal allocator over the Gumbel-Top-m candidate set; see below).
search_visits = 1024
pcr_full_proportion = 0.33
# pcr_fast_visits 128 -> 192 (config-review): 67% of moves are fast/greedy and
# shape the data; late-game 128-visit fast moves blunder ~10.8% (sudden-death) vs
# ~0.3% at 512, so 192 buys deeper 2-3-ply conversion resolution. THROUGHPUT-GATED:
# revert to 128 at launch if pos/s regresses materially (can't measure pre-launch).
pcr_fast_visits = 192
active_games = 96
c_puct = 1.5
virtual_batch_size = 4
flush_target = 1024
active_root_limit = 192
root_dirichlet_total_alpha = 10.83
# root_dirichlet_noise_fraction 0.25 -> 0.20 (config-review, owner: 0.20 not 0.15):
# exploration is not the bottleneck (conversion is). At total_alpha=10.83 over
# Nlegal 337-777 the per-move alpha is spiky (~0.014-0.032), so eps=0.25 hands
# ~28% of the 512-visit budget to ~18 random cells; 0.20 trims that toward
# conversion depth while keeping ample opening diversity (KataGo self-play = 0.25).
# 2026-06-29 (owner): 0.20 -> 0.25 (KataGo self-play value) to widen opening/data
# diversity against the entropy/length narrowing (1.41->1.23, len 103->88) at the plateau.
root_dirichlet_noise_fraction = 0.25
fpu_reduction = 0.2
# KataGo-faithful root FPU (ledger [6]): first-class root FPU reduction. 0.0 =
# KataGo self-play (rootFpuReductionMax=0). Replaces the noise-conditioned
# mechanism; root_fpu_zero_under_noise kept false (legacy branch inert, parity
# path only).
# FIX 2026-06-20 (divergence root-cause): 0.0 -> 0.2 (revert to main_3 known-good).
# With root_fpu_reduction=0.0 every unvisited root child inherits parent_value as its
# FPU baseline; combined with lazy_widening (no children cap) + new_child_fpu the
# overconfident value head dominated root Q on BALANCED openings (turn-0 |Q| climbed
# 0.17->0.79 over 19 epochs vs main_3's flat ~0.05-0.12). Those saturated values became
# the recorded self-play value targets -> next epoch fit them and saturated harder ->
# every loss fell while real strength SANK (Elo -65->-100) and games collapsed 72->40
# plies. 0.2 discounts unexplored root children again, breaking the feedback loop.
root_fpu_reduction = 0.2
root_fpu_zero_under_noise = false
# Dynamic c_puct + LCB, now first-class / config-auditable.
# c_scale=0.0 (KataGo self-play faithfulness): KataGo's SELF-PLAY config
# (selfplay8b20.cfg) sets cpuctExplorationLog=0.0 — the log/visit-scaled term is
# a STRONGER-PLAY *analysis* tunable (0.45 in gtp/analysis), NOT used in training
# self-play. With c_scale=0.0 the c_for(N) log term is inert, so c_puct is a
# constant (visit_scaled_c_puct left true is a no-op at c_scale=0). This REPLACES
# the prior 0.45 (which was the analysis value, kept earlier only for behavioral
# continuity). c_base/lcb_z unchanged.
# NOTE on c_puct: kept at 1.5 (above). Strict self-play faithfulness would use
# cpuctExploration=1.1; since Hexo is pure win/loss its Q is exactly KataGo's
# winLoss utility scale ([-1,1]) so no radius rescale applies and 1.1 is the
# literal value. 1.5 is retained pending an explicit c_puct decision (it favors
# more exploration, which compounds with the other main_4 exploration changes).
visit_scaled_c_puct = true
c_scale = 0.0
c_base = 500.0
lcb_z = 1.6
# Six KataGo-faithful search divergences, ON (== production()). Audit + per-knob
# control for the M6/M10 differential harness. The M5/M6 golden vectors run
# parity() (search_parity_mode=false here; the tests select parity separately)
# so they stay byte-identical regardless.
nucleus_f64 = true
new_child_fpu = true
# FIX 2026-06-20 (divergence root-cause): true -> false (restore main_3 capped widening).
# lazy_widening=true DROPS the progressive-widening child cap entirely (widening gate
# becomes a live peek_next_candidate().is_some() check), so root visits sprayed across
# unbounded breadth while every leaf returned a saturated value -> diffuse policy targets
# (root entropy stuck ~2.5 vs main_3 sharpening to ~1.3) AND it compounds root_fpu=0
# (the two were the co-drivers of the value-Q saturation loop). false falls back to the
# nucleus cap (widening_max_children=96 / widening_policy_mass=0.95 below) = main_3 regime;
# new_child_fpu + nucleus_f64 stay ON but are now bounded by the cap.
lazy_widening = false
clean_root_prior_cache = true
dirichlet_shaped = true
pruned_dynamic_cpuct = true
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
# forced_playout_k 2.0 -> 1.0 (config-review). KataGo k=2 is tuned for ~361 + a
# sharp score-Q; on Hexo's FLAT opening prior over 337-777 legal the forced floors
# (n_forced=sqrt(k*P*N)) sum to ~41% of the 512 budget and spray visits across the
# widened children down to prior ~0.001, halving PV depth where the compressed
# value head needs depth to convert. k=1.0 keeps a GENTLE discovery floor (and the
# forced-playout target-pruning, which only fires when k>0) without the spray.
# NOTE (owner Q): do NOT set k=0 — that disables forced playouts AND the
# policy-target pruning, removing the channel that discovers underrated converting
# moves (sims show this floor, not c_puct, drives tactical discovery). 1.0 (or 1.5)
# is the floor; 0 is not. Late-game high branching (~1000 legal) is handled by
# lazy_widening + FPU lazily opening only the ~dozens of competitive moves, NOT by
# forcing all 1000 (n_forced<1 for any move with prior < ~1/(k*N) ~ 0.002, so the
# ~960 near-zero-prior cells get ZERO forced visits — it is self-limiting).
forced_playout_k = 1.0
policy_init_fraction = 0.25
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
temperature = 1.0
# Temperature reform: higher floor 0.15 kept. halflife 60 -> 45 (config-review):
# main_3 raised halflife to 60 to avoid near-greedy 170+ ply games, but at hl60 the
# conversion-critical ply~40 still samples at T~0.63 (only ~0.43 chance of the top
# converting move), keeping mid/endgame too random where DECISIVENESS is needed and
# manufacturing the non-converting marathons. 45 is a compromise toward KataGo's
# faster decay (halflife 19) WITHOUT reverting all the way to 30 (which would undo
# main_3's anti-greedy intent on a fresh net). floor 0.15 unchanged.
temperature_floor = 0.15
temperature_halflife_plies = 45.0
# Root-policy temperature. KataGo self-play: 1.1 steady + 1.25 early over halflife
# 19. Owner choice (config-review): keep steady=1.1 (KataGo), but SOFTEN the early
# ramp 1.25 -> 1.15. Rationale: temp flattens the root prior BEFORE Dirichlet, and
# Dirichlet already saturates Hexo opening diversity; a 1.25 early-flatten raised
# risky-tail (rank>=30) opening picks ~16.8%->24.2% in sim, and in sudden-death one
# unsound flattened opening stone seeding a completable threat is costly. early=1.15
# is a gentle opening flatten decaying to 1.1. interp is
# temp(ply)=steady+(early-steady)*0.5^(ply/halflife) (== KataGo interpolateEarly);
# halflife 19 plies (Hexo ply ~= KataGo move). REPLACES main_3's flat 1.07.
root_policy_temperature = 1.1
root_policy_temperature_early = 1.15
root_policy_temperature_halflife = 19.0
# Moves-left (decisiveness) utility (inherited from main_3 Stage-1 retune):
# ml_two_sided=false (favor fast wins, do not reward dragging out losses);
# ml_final_pick_band 0.08 (broader decisive root tie-break). ml_weight/ml_scale/
# ml_q_gate/moves_left_utility stay at production defaults.
ml_two_sided = false
ml_final_pick_band = 0.08
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144

# --- main_6 FULL Gumbel AlphaZero knobs (Danihelka et al. 2022, ENABLED) ------
# All four enable flags true => Divergences::gumbel(). Each flag below gates one
# independent mechanism; flip any back to false (no rebuild) to bisect.
#
# #1 ROOT — Gumbel-Top-k candidate sampling. At each FULL root, draw g(a)~Gumbel
#   (0,1) per legal action (dedicated SEED_STREAM_GUMBEL), take the top
#   m=min(gumbel_m, n_legal) by logits(a)+g(a) as the candidate set, REPLACING
#   Dirichlet noise + root-policy-temperature as the diversity source. (Dirichlet
#   knobs above stay set but are inert on Gumbel roots.)
gumbel_root_enabled = true
# #1 ROOT — Sequential Halving visit allocation (requires gumbel_root). Splits
#   the search_visits budget equally per round across the surviving candidates;
#   after each round ranks survivors by g(a)+logits(a)+sigma(completedQ(a)) and
#   keeps the top ceil(|A_r|/2). Realized as per-slot SH state with an intra-slot
#   barrier so the async cross-root flush/batching is untouched. With it OFF (and
#   gumbel_root ON) visits allocate via normal PUCT among the Gumbel-Top-m set
#   (an A/B intermediate mode). ON = the canonical Gumbel root.
gumbel_sequential_halving = true
# #2 SELECT — deterministic non-root selection. Interior nodes pick
#   argmax_a[logits(a)+sigma(completedQ(a))] — NO PUCT / c_puct / FPU / widening
#   gate (the score formula replaces the lazy-widening FPU score). New children
#   still materialize via the existing peek/expand machinery; their selection
#   priority is logits(a)+sigma(v_mix). c_puct/fpu_reduction above are inert on
#   interior nodes when this is ON (still used by any non-Gumbel/fallback path).
gumbel_nonroot_select = true
# #3 TARGET — export the improved-policy training target. At Full roots compute
#   pi'(a)=softmax_a(logits(a)+sigma(completedQ(a))) over the candidate support
#   and write it as the policy target (consumed when policy_target="gumbel"
#   below). Requires export_root_prior_logits so Rust receives the raw policy
#   logits. Rows without a gumbel target (fast/old shards) fall back to "visit".
gumbel_target_enabled = true
# sigma(q) = (gumbel_c_visit + max_b N(b)) * gumbel_c_scale * q  (the monotone
#   transform that scales completedQ into logit space; max_b N(b) is the max
#   child visit at the node sigma is applied to). c_visit=50, c_scale=1.0 are the
#   canonical Danihelka constants. Q is on [-1,1] here (Q_UTILITY_WIDTH=2.0), a
#   clean sigma input — NO rescale needed. Leave at the paper defaults; these are
#   the validated values, not a hexo-tuned crutch.
gumbel_c_visit = 50.0
gumbel_c_scale = 1.0
# gumbel_m = 16 candidates (clamped to n_legal; opening's forced (0,0) -> m=1).
#   With budget 1024 this is R=ceil(log2(16))=4 SH rounds. m=16 is the Danihelka
#   default and suits Hexo's wide branching (337->~1000): large enough to cover
#   the realistic move set, small enough that each survivor gets a deep ~256+
#   visit allocation under SH.
gumbel_m = 32
# gumbel_target_min_visits = 1 — support floor for the #3 target: root actions
#   with N(a) < this are EXCLUDED from the pi' softmax support (then renormalize),
#   denying the value head a target write on un-searched cells. 1 keeps any
#   candidate that received >=1 visit; raise to harden the support against
#   single-visit noise if the target proves too diffuse.
gumbel_target_min_visits = 1
# export_root_prior_logits — ask the evaluator for raw pre-softmax policy logits
#   (carried onto the root for the sigma/Gumbel/target math). REQUIRED by #1/#3
#   (and #2 reads the per-node logits the same way). ON with the profile.
export_root_prior_logits = true

# KataGo / dense_cnn_restnet replay-buffer port (inherited verbatim from main_3,
# PLAN §6/§7). Defaults are hexfield-tuned (NOT dense's literals): the
# dimensionless KataGo constants (exponent=0.65, expand=0.4) are unchanged, but
# min_rows/scale/keep_target are scaled to hexfield's ~7k Full rows/epoch stream.
[model.config.training]
# FIX 2026-06-22 (improvement-probe battery, root cause): batch_rows 32 -> 128.
# The gradient-noise-scale probe (f1) found the optimizer NOISE-DOMINATED at b=32
# (mean|g|^2 ~21.7@b32 vs ~4.9@b128 => |G|^2~0, ~pure noise; critical batch in the
# hundreds). Noise-dominated SGD lowers TRAIN loss by fitting each noisy micro-batch
# without cleanly following the true gradient that converts to STRENGTH (the exact
# loss-down/strength-flat signature) and leaves the policy prior under-converged/too
# diffuse (c2: +0.60 nats above its own MCTS target). The trainer already does
# mathematically-exact gradient accumulation, so this raises the EFFECTIVE batch with
# per-forward VRAM UNCHANGED (no OOM). lr kept at 3e-4 (f2: lr is NOT the bottleneck,
# no overshoot; main_3 sweep = lower-is-better). Reversible: set back to 32.
# (NOTE: the workflow's "dead cell_q" primary cause was a FALSE POSITIVE from a buggy
# offline reader; production training reads q fine via the window+rust expand.)
batch_rows = 256  # 2026-06-22: 128->256. KataGo's training batch (~256) AND ~half our f1-measured critical batch (~512); cuts gradient-noise fraction ~80%->~67%. Paired with lr 3e-4->5e-4 below.
# learning_rate 3e-4 -> 5e-4 (owner). main_3's held-out sweep found lower-is-better
# across [5e-4,1e-3] (1e-3 worst) and adopted 3e-4; 5e-4 is a deliberate step UP for
# a FRESH run (fresh-governor warm start + the new soft head benefit from a slightly
# hotter early lr). Watch early-epoch grad/clip stability; drop to 3e-4 if unstable.
# FIX 2026-06-20 (divergence root-cause): 5e-4 -> 3e-4 (revert to main_3 known-good).
# main_3's held-out sweep found lower-is-better; 5e-4 only AMPLIFIED the fit to the
# saturating value targets on a fresh-from-prefit net. Back to the proven 3e-4.
learning_rate = 4e-4  # 2026-06-29 (owner): 5e-4 -> 4e-4, slight late-run decay at the ep60-100 plateau. (Prior: 2026-06-22 3e-4->5e-4 to scale with batch 128->256; f2 probe confirmed <=5e-4 has no overshoot.)
weight_decay = 1e-4
grad_clip = 5.0
# Adaptive grad clip (#1): after clip_warmup_steps, clip at clip_c*EMA(pre-clip norm).
adaptive_clip = true
clip_c = 1.75
clip_ema_decay = 0.99
clip_warmup_steps = 50
# Config-driven loss weights (#2); defaults mirror losses.py constants.
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.1
# moves_left_weight 0.1 -> 0.2 (config-review): the moves-left head feeds the
# in-search moves_left_utility — the lever explicitly built to attack the
# conversion-failure/defensive-lock pathology — and a heal-gate disables that
# utility when the head is unhealthy. Up-weighting sharpens the head so ml-utility
# stays on and drives decisiveness. (Escalate to 0.3 only if the head fails its
# heal-gate audit; not beyond.)
moves_left_weight = 0.2
q_head_weight = 0.1
# KataGo auxiliary SOFT policy target (NEW for main_4), HEXO-ADAPTED. Train-only
# soft_policy head, CE against the soft target derived in collate_training from the
# visit policy (no shard/replay_expand change). KataGo uses ^0.25 (T=4) over the
# FULL legal set at weight 8.0; on Hexo's 70-700-cell legal sets that leaks ~40-72%
# of mass onto the unvisited tail (savage in sudden-death), so we use a gentler
# HEXO target: p^0.5 (T=2), SUPPORT-ONLY (no full-legal 1e-7 floor), and HALVE the
# weight to 4.0 (sharper target => larger per-row gradient). Must match
# losses.SOFT_POLICY_WEIGHT and the transform in batching.collate_training.
# FIX 2026-06-20 (divergence root-cause): 4.0 -> 1.0 (correct an obviously-miscalibrated
# value). At 4.0 the train-only soft-policy aux head was ~75% of the TOTAL weighted
# objective every epoch (raw soft loss ~4.0 x 4.0 = ~16 vs main policy ~3.1 x 1.0), so
# the shared trunk was optimized 5:1 toward fitting (visit_policy)^0.5 instead of the
# real policy/value targets -> the main policy head learned ~2x slower than main_3.
# 1.0 keeps the head as a mild regularizer (still slightly below the main policy head in
# weighted magnitude) without dominating the trunk. Must match losses.SOFT_POLICY_WEIGHT
# consumption (config override path). Secondary to the search reverts above.
soft_policy_weight = 1.0
# Policy-surprise self-CE reweight (#5).
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0
warmup_steps = 0
shuffle_min_rows = 20000
# 2026-06-22 (PCR window): 300k->600k headroom. With 3x rows/epoch the taper window
# self-grows and would hit the old 300k cap in ~100ep; 600k lets it grow toward the
# OLD ~12-epoch coverage uncapped. ~1.8GB RAM at cap (23GB free). keep_target was the
# WRONG near-term knob (inert until the window reaches it); expand_window_per_row below
# is the binding lever.
shuffle_keep_target_rows = 600000
shuffle_taper_window_exponent = 0.65
# 2026-06-22 (PCR window): 0.4->0.8 DOUBLES the distinct-position POOL now (~108k->~196k),
# restoring epoch-coverage from ~4 (lost to 3x rows/epoch under the PCR value-rows fix)
# to ~7 now, growing to ~12 as data accumulates. Value targets (hard z) never go stale,
# so a wider window is ~pure upside for the de-noised value head; RAM is abundant.
shuffle_expand_window_per_row = 0.8
shuffle_taper_window_scale = 20000.0
validation_fraction = 0.0
# FIX 2026-06-22 (PCR value-rows): 48000 -> 142000 (~3x). The writer now records
# FAST-search moves as VALUE-ONLY rows (policy_valid=0: train value/stvalue/
# moves_left, mask policy/opp_policy/soft_policy/cell_q), ~3x'ing rows_written/
# epoch (~9k full -> ~27k full+fast). Policy still trains only on the ~33% full
# rows, so raising tspe ~3x holds the POLICY head's per-epoch training rate AND
# reuse_ratio (~5.3 = 142000/27000) constant while ~3x'ing the value-target data.
# Self-play (the epoch bottleneck) is UNCHANGED (fast moves are already played);
# training compute ~3x (~15% slower epochs, owner-sanctioned). After the smoke,
# re-set to round(48000 * measured_rows_after / 9022) if the multiplier is off.
train_samples_per_epoch = 3000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000.0
no_repeat_files = false
# expand_backend="rust" KEPT (main_3 default). The soft target is derived in
# collate_training (a pure function of the visit policy AFTER expand), so the
# Rust train-read kernel (replay_expand.rs) needs NO change and stays element-
# identical across serial/pool/rust backends. To roll back, flip to "serial".
expand_backend = "rust"
expand_workers = 0
# main_6 training-side policy-target selector. "gumbel" trains the main policy
# head against the #3 improved-policy target pi'=softmax(logits+sigma(completedQ))
# (exported by gumbel_target_enabled above), with a PER-ROW fallback to the
# visit-count target on any row lacking a gumbel target (fast/value-only rows,
# old shards). Must be set under [model.config.training] (losses.py sources it
# from TrainingSection, NOT SelfplayConfig). Set to "gumbel" to complete the
# full profile; revert to "visit" to train on visit counts while keeping the
# Gumbel SEARCH on (search-only A/B).
policy_target = "gumbel"

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5

# In-run COMPARABLE strength eval (eval-v2), inherited verbatim from main_3.
[model.config.multi_stage_eval]
enabled = true
games_budget = 128
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 32
sealbot_share = 0.5
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
enabled = false

[model.config.multi_stage_eval.opponents]
sealbot_enabled = true
bracket_size = 1
permanent_anchors = [["main4_ep60", "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_4/checkpoints/epoch_000060.pt"], ["ep5", "epoch_000005.pt"]]
radius8_opponents = []

[run]
name = "hexfield_gumbel_e2e"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/_gumbel_e2e_test"
seed = 1

[loop]
epochs = 1

[selfplay]
games_per_epoch = 16
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# FRESH-init warm start (NOT a resume): the initialize_from branch loads matching
# weights only and starts a fresh train bucket / governor (tolerant non-strict
# load; the `resume` path stays strict).
# CHECKPOINT 0 = a main_4-arch BC prefit trained on hexfield_main_3 epochs 40-45
# self-play samples (all ~1270 shards, 6 epochs, torch.compile path). UNLIKE the
# old v3 prefit, this checkpoint ALREADY carries trained soft_policy_* weights
# (the prefit builds the full main_4 HexfieldNet), so the new head warm-starts
# pretrained rather than zero-init. Same {model,optimizer,scaler,...} format as the
# v3 prefit, so the loader path is unchanged. Does NOT point at any live run.
# main_6 WARM-START: epoch_000117 — the NEWEST healthy main_5 c=128 checkpoint
# available in /mnt/e/Hexo-BotTrainer/runs/hexfield_main_5/checkpoints/ (35MB,
# same shape as every prior epoch; main_5 is post-plateau and HEALTHY per the
# ep85-102 audits — no main_4 value-Q pathology). Gumbel changes only SEARCH +
# the policy TARGET, not the net SHAPE, so the main_5 net loads as-is through the
# tolerant non-strict initialize_from path. FRESH run (new governor / train
# bucket); main_5 optimizer state is intentionally NOT resumed. If a newer
# main_5 epoch exists at launch, prefer the latest healthy one.
initialize_from = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_5/checkpoints/epoch_000105.pt"  # main_5 c=128 net, epoch 105 (strongest per operator)
save_name = "latest"
