# hexfield_main_10 — PUCT HYBRID (1024 full / 192 fast). Same net as main_9
# (c=128, heads 2x64, trunk CCACCACCA), WARM-STARTED from the main_9 epoch-30
# checkpoint and continued.
#
# SEARCH REGIME (identical structure to main_9; this is NOT the earlier Gumbel
# prep):
#   Full moves (33% of turns, 1024 visits) -> classic PUCT with the full KataGo
#     kit (Dirichlet noise, forced playouts + target pruning, visit-scaled c_puct,
#     progressive/lazy widening, LCB play). Policy target = pruned VISIT COUNTS.
#     THESE ARE THE ONLY ROWS WRITTEN TO THE TRAINING BUFFER.
#   Fast moves (67% of turns, 192 visits, value-only) -> play a Gumbel root + SH
#     search for progression only; their rows are DROPPED at the writer (fast-row
#     training is fully removed from the pipeline).
#
# WHAT main_10 CHANGES vs main_9:
#   * search_visits 768 -> 1024 (full-move budget back up).
#   * WARM START from main_9 ep30 (below) instead of the BC prefit.
#   * EVAL LADDER restricted to SealBot (48 games) + main6_ep73 + main5_ep105;
#     sliding bracket kept as-is.
#
# Architecture env is in scripts/systemd/hexfield-supervisor-10.service and is
# IDENTICAL to main_9: HEXFIELD_CHANNELS=128 ATTENTION_HEADS=2 TRUNK=CCACCACCA.

[model]
name = "hexfield"
module = "hexfield.plugin"

[model.config]
device = "cuda"

[model.config.selfplay]
search_visits = 1024
pcr_full_proportion = 0.33
pcr_fast_visits = 192
# Locked 0.0 (P0 outcome-skew conviction 2026-07-04). Fast-move exploration comes
# from the Gumbel candidate draw, not outcome-flipping play temperature.
pcr_fast_temperature = 0.0
active_games = 192
virtual_batch_size = 48
flush_target = 1024
active_root_limit = 192
max_game_plies = 256
tss_enabled = true
cache_max_states = 262144
nucleus_f64 = true
lcb_z = 1.6
clean_root_prior_cache = true

# ---- Full-move PUCT (exports policy targets) ----
c_puct = 1.5
visit_scaled_c_puct = true
c_scale = 0.45
c_base = 500.0
root_dirichlet_noise_fraction = 0.25
root_dirichlet_total_alpha = 10.83
dirichlet_shaped = true
# KataGo-faithful FPU. Interior fpuReductionMax = 0.2; root FPU = 0.0 (KataGo
# self-play rootFpuReductionMax). The reduction is √(policyProbMassVisited)-scaled
# in the engine (the `scaled_fpu` divergence, on in production). Root at 0.0 means
# unvisited root children inherit the full parent value — search relies on the
# value head + Dirichlet + forced playouts for root exploration, exactly like
# KataGo. (The old noise-conditioned root_fpu_zero_under_noise knob is gone.)
fpu_reduction = 0.2
root_fpu_reduction = 0.0
# KataGo value 2.0. Forces sqrt(k*P(a)*N) visits on noised children so root noise
# reaches the tree; the exported target is de-noised by the dynamic-cpuct pruning.
forced_playout_k = 2.0
pruned_dynamic_cpuct = true
# Progressive widening: children materialize one at a time when the new-child
# (FPU + U) score beats every expanded edge.
lazy_widening = true
new_child_fpu = true
widening_policy_mass = 0.95
widening_max_children = 96
widening_min_children = 2
# Play schedule (Full moves): T=1.0 decaying, floor 0.15, halflife 20 plies.
temperature = 1.0
temperature_floor = 0.15
temperature_halflife_plies = 20.0
# Flat root policy temperature, no ply-decayed early ramp.
root_policy_temperature = 1.05
# Opening diversity channel.
policy_init_fraction = 0.35
policy_init_avg_plies = 4.0
policy_init_max_plies = 8
policy_init_temperature = 1.4
ml_two_sided = false
ml_final_pick_band = 0.08
# Full moves export raw root logits (surprise baseline + dashboard).
export_root_prior_logits = true

# Gumbel OFF for the Full class (Full = PUCT). Enabled only for the Fast class
# via the fast_gumbel_* overrides below.
gumbel_root_enabled = false
gumbel_sequential_halving = false
gumbel_nonroot_select = false
gumbel_target_enabled = false

# ---- Fast-move Gumbel (value-only rows; per-class override of the above) ----
# m auto-calibrates down to the 192-visit budget inside init_gumbel_root
# (effective m ~8-16); 32 is the cap. Fast rows are never WRITTEN.
fast_gumbel_root_enabled = true
fast_gumbel_sequential_halving = true
fast_gumbel_nonroot_select = true
fast_gumbel_c_visit = 50.0
fast_gumbel_c_scale = 1.0
fast_gumbel_m = 32
fast_gumbel_play_prune = true

[model.config.training]
batch_rows = 256
# Decay to 4e-4 at the mid-run plateau per the main_6 playbook.
learning_rate = 5e-4
weight_decay = 1e-4
grad_clip = 5.0
adaptive_clip = true
clip_c = 1.75
clip_ema_decay = 0.99
clip_warmup_steps = 50
policy_weight = 1.0
value_weight = 1.0
opp_policy_weight = 0.25
short_term_value_weight = 0.1
moves_left_weight = 0.2
q_head_weight = 0.1
soft_policy_weight = 0.5
policy_surprise_uniform_fraction = 0.5
policy_surprise_max_weight = 8.0
warmup_steps = 0
# Shuffle window sized for the KataGo-clean row rate (~33% of turns written; fast
# rows dropped). Same as main_9.
shuffle_min_rows = 7000
shuffle_keep_target_rows = 210000
shuffle_taper_window_exponent = 0.65
shuffle_expand_window_per_row = 0.8
shuffle_taper_window_scale = 7000.0
validation_fraction = 0.0
# Matches the trimmed (full-only) write rate.
train_samples_per_epoch = 32000
max_train_bucket_per_new_data = 8.0
max_train_bucket_size = 500000.0
no_repeat_files = false
expand_backend = "rust"
expand_workers = 0
# Pruned visit counts (the PUCT Full-move target).
policy_target = "visit"

[model.config.evaluation]
games_per_epoch = 16
eval_visits = 128
eval_every = 5

[model.config.multi_stage_eval]
enabled = true
# 192-game budget so the Strix zero-point can take a well-powered 64-game pairing
# (0.3333 * 192 = 64) every 5 epochs WITHOUT starving the checkpoint ladder:
# Strix 64 + SealBot 32 (0.1667 * 192) leaves 96 split across main6_ep73 +
# main5_ep105 + the sliding bracket (~32 each, paired).
games_budget = 192
every_n_epochs = 5
full_search_visits = 512
eval_virtual_batch_size = 32
# Strix is the PREFERRED (deterministic, GPU-batched) 0-Elo anchor, so SealBot is
# demoted to the fallback zero-point and its share drops (0.1667 * 192 = 32); its
# edge is still played + pooled, just no longer the pin. Strix takes the larger
# zero-point pairing (0.3333 * 192 = 64) at full likelihood weight.
sealbot_share = 0.1667
strix_share = 0.3333
strix_weight = 1.0
verdict_reference_lag = 5
pool_path = "diagnostics/eval_pool.json"

[model.config.multi_stage_eval.sprt]
enabled = false

[model.config.multi_stage_eval.opponents]
sealbot_enabled = true
# Strix zero-point (SootyOwl/hexo-strix HeXONet). PREFERRED pinned 0-Elo anchor:
# deterministic greedy tail with opening-confined light Gumbel noise, played as a
# paired CRN pentanomial vs the candidate. strix_sims/m mirror hexo-strix's
# EvalConfig. NOTE: relocate this checkpoint out of Downloads to a stable path
# before a long run.
strix_enabled = true
strix_ckpt = "/mnt/c/Users/epicm/Downloads/checkpoint_00237000.pt"
strix_sims = 256
strix_m = 16
strix_device = "cuda"
strix_label = "strix"
# Sliding bracket kept as-is (nearest rung(s) of log_grid below the current epoch).
bracket_size = 1
# Ladder restricted to SealBot + these two permanent anchors (+ the sliding bracket).
permanent_anchors = [["main6_ep73", "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_6/checkpoints/epoch_000073.pt"], ["main5_ep105", "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_5/checkpoints/epoch_000105.pt"]]
radius8_opponents = []

[run]
name = "hexfield_main_10"
output_dir = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_10"
seed = 1

[loop]
epochs = 200

[selfplay]
games_per_epoch = 256
update_checkpoint_pointer = false

[train]
passes_per_epoch = 1

[checkpoint]
# WARM START (fresh governor / epoch 0, tolerant non-strict load): the main_9
# epoch-30 checkpoint. Same arch (c=128 / heads 2 / CCACCACCA). On the supervisor's
# FIRST LAUNCH this initialize_from is used; subsequent epochs resume from
# main_10's own latest checkpoint.
initialize_from = "/mnt/e/Hexo-BotTrainer/runs/hexfield_main_9/checkpoints/epoch_000030.pt"
save_name = "latest"
